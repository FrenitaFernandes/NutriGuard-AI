<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allergy profile · NutriGuard AI</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><a class="brand" href="/">NutriGuard AI</a><a href="/upload.html">Analyze label</a></nav><main class="container"><h1>Allergy profile</h1><p class="muted">This profile is saved locally in your browser and is only sent with an analysis you submit.</p><form id="profile-form" class="card"><label for="profile-allergies">Allergies, comma separated</label><input id="profile-allergies" placeholder="milk, wheat, peanut, sesame"><button type="submit">Save profile</button><button type="button" id="clear-profile" class="button secondary">Remove all</button><div id="profile-status" class="status"></div></form><section class="card" style="margin-top:1rem"><h2>Saved allergies</h2><div id="saved-allergies" class="grid"></div></section></main><script>const key="nutriguard-allergies",input=document.querySelector("#profile-allergies"),form=document.querySelector("#profile-form"),status=document.querySelector("#profile-status"),savedList=document.querySelector("#saved-allergies");function values(){return JSON.parse(localStorage.getItem(key)||"[]")}function render(){const current=values();input.value=current.join(", ");savedList.innerHTML=current.length?current.map((value,index)=>`<div class="status"><strong>${value}</strong> <button type="button" data-index="${index}" class="button secondary">Remove</button></div>`).join(""):"<p class='muted'>No allergies saved.</p>"}form.addEventListener("submit",event=>{event.preventDefault();const current=input.value.split(",").map(value=>value.trim()).filter(Boolean);localStorage.setItem(key,JSON.stringify([...new Set(current)]));status.textContent="Profile saved on this device.";render()});document.querySelector("#clear-profile").addEventListener("click",()=>{localStorage.removeItem(key);status.textContent="Profile cleared.";render()});savedList.addEventListener("click",event=>{const index=event.target.dataset.index;if(index===undefined)return;const current=values();current.splice(Number(index),1);localStorage.setItem(key,JSON.stringify(current));render()});render();</script></body></html>
